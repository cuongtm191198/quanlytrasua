<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MILK TEA MANAGEMENT</title>
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#202432;--muted:#788092;--line:#e8eaf0;--brand:#6c4ce3;--brand2:#8b72f0;--green:#16a36a;--red:#e05260;--amber:#e69a28;--nav:#202235}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#eee;color:var(--ink);font-weight:600}button.primary{background:var(--brand);color:white}button.success{background:var(--green);color:white}button.danger{background:#fff0f1;color:var(--red)}button.small{padding:6px 9px;font-size:12px}.app{display:flex;min-height:100vh}.sidebar{width:238px;background:var(--nav);color:#fff;padding:22px 14px;flex-shrink:0}.logo{font-weight:800;font-size:18px;letter-spacing:.5px;padding:4px 10px 24px}.logo span{color:#b6a6ff}.nav-label{color:#9295aa;font-size:10px;font-weight:700;letter-spacing:1.2px;padding:12px 11px 7px}.nav button{width:100%;text-align:left;background:transparent;color:#c7c8d4;margin:2px 0;padding:11px;border-radius:9px;font-weight:500}.nav button.active,.nav button:hover{background:#37334f;color:white}.nav button b{display:inline-block;width:26px;font-size:16px}.side-bottom{margin-top:30px;border-top:1px solid #3c3d50;padding:15px 10px;color:#aeb0c0;font-size:12px}.main{flex:1;min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar strong{font-size:15px}.status{color:var(--green);font-size:12px;font-weight:700}.content{padding:26px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.page-head h1{font-size:23px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px}.metric-label{color:var(--muted);font-size:12px}.metric{font-size:25px;font-weight:800;margin:8px 0 2px}.metric-note{font-size:11px;color:var(--muted)}.panel{margin-bottom:18px}.panel h3{margin:0 0 15px;font-size:15px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.field{border:1px solid #dfe2ea;border-radius:8px;padding:10px 11px;background:#fff;min-width:130px;color:var(--ink)}.field:focus{outline:2px solid #d9d0ff;border-color:var(--brand)}input.field{min-width:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;color:var(--muted);font-weight:700;background:#fafbfc}td{font-size:13px}tr:last-child td{border-bottom:0}.right{text-align:right}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0edff;color:#6848d8;font-size:11px;font-weight:700}.pill.green{background:#e8f8f0;color:#148653}.pill.red{background:#fff0f1;color:#d44856}.empty{text-align:center;padding:32px;color:var(--muted)}.pos-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.85fr);gap:18px}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}.product-tile{background:white;border:1px solid var(--line);border-radius:11px;padding:13px;text-align:left;min-height:112px}.product-tile:hover{border-color:var(--brand);box-shadow:0 4px 15px #5540a015}.product-icon{font-size:25px;margin-bottom:7px}.product-name{font-weight:700;font-size:13px}.product-price{color:var(--brand);font-weight:800;margin-top:5px}.cart-row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:3px 8px}.total-line{display:flex;justify-content:space-between;margin:9px 0}.grand{font-size:19px;font-weight:800;border-top:1px solid var(--line);padding-top:13px;margin-top:13px}.modal-back{position:fixed;inset:0;background:#15152588;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{background:white;border-radius:14px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h3{margin:0 0 17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-item{display:flex;flex-direction:column;gap:5px}.form-item.full{grid-column:1/-1}.form-item label{font-size:12px;color:var(--muted);font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{background:#f3f0ff;color:#5c45bd;padding:12px 14px;border-radius:9px;font-size:12px;margin-bottom:16px}.chart-bars{height:180px;display:flex;align-items:end;gap:10px;padding:12px 3px 0}.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:end}.bar{width:100%;max-width:42px;background:linear-gradient(180deg,#9a85f5,#6c4ce3);border-radius:6px 6px 0 0;min-height:3px}.bar-label{font-size:10px;color:var(--muted)}.hidden{display:none!important}.footer-note{font-size:11px;color:var(--muted);margin-top:12px}@media(max-width:950px){.sidebar{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.pos-layout{grid-template-columns:1fr}}@media(max-width:650px){.sidebar{width:62px;padding:15px 7px}.logo{font-size:0;padding:5px}.logo:first-letter{font-size:20px}.nav-label,.nav button span,.side-bottom{display:none}.nav button{padding:12px 8px;text-align:center}.nav button b{width:auto}.content{padding:15px}.topbar{padding:0 15px}.cards{gap:8px}.metric{font-size:20px}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.form-item.full{grid-column:auto}}
</style>

<style>
.nav button{font-size:13px}.nav-label{margin-top:4px}
.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#f2f3f7;font-size:11px;color:#596174}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.statline{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.recipe-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.recipe-item{border:1px solid var(--line);border-radius:9px;padding:10px}
.recipe-item label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.recipe-item input{width:100%}
.action-row{display:flex;gap:7px;flex-wrap:wrap}
.table-wrap{overflow:auto}
.kpi{font-size:12px;color:var(--muted)}
.warn{background:#fff7e8;color:#98620b;padding:11px;border-radius:9px;font-size:12px}
@media(max-width:950px){.split{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">MILK TEA <span>MANAGEMENT</span></div>
  <div class="nav-label">BÁN HÀNG</div>
  <nav class="nav">
    <button class="active" data-page="dashboard"><b>▦</b><span>Tổng quan</span></button>
    <button data-page="pos"><b>▣</b><span>Bán hàng POS</span></button>
    <button data-page="orders"><b>☷</b><span>Đơn hàng</span></button>
  </nav>
  <div class="nav-label">DANH MỤC & KHO</div>
  <nav class="nav">
    <button data-page="products"><b>◈</b><span>Sản phẩm & công thức</span></button>
    <button data-page="inventory"><b>▤</b><span>Nguyên liệu</span></button>
    <button data-page="purchases"><b>⇧</b><span>Nhập hàng & NCC</span></button>
    <button data-page="customers"><b>♙</b><span>Khách hàng</span></button>
  </nav>
  <div class="nav-label">TÀI CHÍNH & NHÂN SỰ</div>
  <nav class="nav">
    <button data-page="cash"><b>＄</b><span>Thu chi</span></button>
    <button data-page="shifts"><b>◷</b><span>Ca làm & chốt ca</span></button>
    <button data-page="attendance"><b>◴</b><span>Chấm công</span></button>
    <button data-page="staff"><b>♟</b><span>Nhân viên & phân quyền</span></button>
    <button data-page="reports"><b>▥</b><span>Báo cáo & Excel</span></button>
  </nav>
  <div class="nav-label">HỆ THỐNG</div>
  <nav class="nav"><button data-page="settings"><b>⚙</b><span>Cài đặt & dữ liệu</span></button></nav>
  <div class="side-bottom">Phiên bản Offline 2.3<br>Chỉ lưu trên máy tính này</div>
</aside>
<main class="main">
<header class="topbar"><strong id="storeTitle">Cửa hàng trà sữa</strong><div style="display:flex;gap:10px;align-items:center"><span id="currentUser" class="muted"></span><button class="small" id="logoutButton" onclick="logout()" title="Đăng xuất" aria-label="Đăng xuất" style="display:none">Đăng xuất</button><button class="small primary" id="accountButton" onclick="switchUser()" title="Đăng nhập / Đổi tài khoản" aria-label="Đăng nhập / Đổi tài khoản"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg></button><div class="status">● OFFLINE</div></div></header>
<div class="content" id="view"></div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<script>
const KEY='milkTeaManagement_v2', OLDKEY='milkTeaManagement_v1';
const money=n=>(Number(n)||0).toLocaleString('vi-VN')+' ₫';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=x=>JSON.parse(JSON.stringify(x));
const seed={
 version:2,store:'Cửa hàng trà sữa',products:[
 {id:'p1',name:'Trà sữa truyền thống',category:'Trà sữa',icon:'🧋',active:true,sizes:{M:30000,L:36000},recipe:{'i1':0.008,'i2':0.025,'i3':0.020,'i5':1,'i6':1,'i9':0.15}},
 {id:'p2',name:'Trà sữa trân châu đường đen',category:'Trà sữa',icon:'🥤',active:true,sizes:{M:35000,L:42000},recipe:{'i1':0.008,'i2':0.025,'i3':0.018,'i5':1,'i6':1,'i9':0.15}},
 {id:'p3',name:'Trà đào cam sả',category:'Trà trái cây',icon:'🍑',active:true,sizes:{M:32000,L:39000},recipe:{'i1':0.006,'i3':0.015,'i5':1,'i6':1,'i9':0.15}},
 {id:'p4',name:'Trà vải',category:'Trà trái cây',icon:'🍹',active:true,sizes:{M:30000,L:37000},recipe:{'i1':0.006,'i3':0.015,'i5':1,'i6':1,'i9':0.15}},
 {id:'p5',name:'Matcha latte',category:'Matcha',icon:'🍵',active:true,sizes:{M:38000,L:45000},recipe:{'i2':0.025,'i3':0.015,'i5':1,'i6':1,'i9':0.15}},
 {id:'p6',name:'Cacao sữa',category:'Đồ uống',icon:'🥛',active:true,sizes:{M:33000,L:40000},recipe:{'i2':0.020,'i3':0.015,'i5':1,'i6':1,'i9':0.15}}
 ],
 toppings:[
 {id:'t1',name:'Trân châu đen',price:7000,recipe:{i4:0.035}},
 {id:'t2',name:'Thạch trái cây',price:7000,recipe:{i7:0.040}},
 {id:'t3',name:'Pudding trứng',price:8000,recipe:{i8:1}}
 ],
 ingredients:[
 {id:'i1',name:'Trà đen',unit:'kg',stock:5,min:2,cost:120000},
 {id:'i2',name:'Sữa bột',unit:'kg',stock:8,min:3,cost:180000},
 {id:'i3',name:'Đường',unit:'kg',stock:10,min:3,cost:25000},
 {id:'i4',name:'Trân châu',unit:'kg',stock:2,min:3,cost:65000},
 {id:'i5',name:'Ly nhựa',unit:'cái',stock:300,min:100,cost:700},
 {id:'i6',name:'Ống hút',unit:'cái',stock:400,min:100,cost:150},
 {id:'i7',name:'Thạch trái cây',unit:'kg',stock:2,min:1,cost:70000},
 {id:'i8',name:'Pudding trứng',unit:'cái',stock:80,min:20,cost:2500},
 {id:'i9',name:'Đá viên',unit:'kg',stock:30,min:8,cost:5000}
 ],
 suppliers:[],purchases:[],cash:[],customers:[],orders:[],
 staff:[{id:'u1',name:'Quản lý',username:'admin',pin:'1234',role:'Quản lý',active:true},{id:'u2',name:'Thu ngân',username:'cashier',pin:'1111',role:'Thu ngân',active:true}],
 shifts:[],currentUserId:'u1',currentShiftId:null
};
function migrate(){
 let raw=localStorage.getItem(KEY);
 if(raw){try{return JSON.parse(raw)}catch(e){}}
 let old=localStorage.getItem(OLDKEY);
 if(old){try{let o=JSON.parse(old),d=clone(seed);d.store=o.store||d.store;d.products=(o.products||d.products).map(p=>({...p,sizes:p.sizes||{M:Number(p.price)||30000,L:(Number(p.price)||30000)+6000},recipe:p.recipe||{}}));d.ingredients=o.ingredients||d.ingredients;d.orders=(o.orders||[]).map(x=>({...x,profit:x.profit||0}));d.customers=o.customers||[];return d}catch(e){}}
 return clone(seed)
}
let db=migrate(),cart=[];db.attendance=db.attendance||[];db.shifts=db.shifts||[];db.staff=db.staff||clone(seed.staff);
if(!db.staff.some(s=>s.role==='Quản lý')) db.staff.unshift({id:'u1',name:'Quản lý',username:'admin',pin:'1234',role:'Quản lý',active:true});
db.currentUserId=null; // Luôn yêu cầu đăng nhập lại khi mở ứng dụng

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function user(){return db.currentUserId?db.staff.find(x=>x.id===db.currentUserId)||null:null}
function isManager(){return user()?.role==='Quản lý'}
function can(page){if(!user())return false;if(isManager())return true;return ({dashboard:true,pos:true,orders:true,products:false,inventory:false,purchases:false,customers:false,cash:false,shifts:true,attendance:true,staff:false,reports:false,settings:false})[page]!==false}
function setPage(p){if(!can(p))return alert('Tài khoản hiện tại không có quyền truy cập chức năng này.');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render(p)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function pageHead(t,s,b=''){return `<div class="page-head"><div><h1>${t}</h1><div class="sub">${s}</div></div>${b}</div>`}
function render(p='dashboard'){if(!can(p))p='dashboard';window.currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>{b.style.display=can(b.dataset.page)?'':'none';b.classList.toggle('active',b.dataset.page===p)});document.getElementById('storeTitle').textContent=db.store;document.getElementById('currentUser').textContent=user()?user().name+' · '+user().role:'';let lb=document.getElementById('logoutButton');if(lb)lb.style.display=user()?'':'none';let v=document.getElementById('view');({dashboard,pos,orders,products,inventory,purchases,customers,cash,shifts,attendance,staff,reports,settings}[p]||dashboard)(v)}

function activeShift(){return db.shifts.find(s=>s.status==='Đang mở')||null}
function requireShift(){if(!user()){alert('Vui lòng đăng nhập.');return false}if(!activeShift()){alert('Hiện chưa có ca bán hàng. Vui lòng yêu cầu nhân viên phụ trách hoặc quản lý mở ca.');setPage('shifts');return false}return true}
function dashboard(v){
 let d=today(),ods=db.orders.filter(o=>o.date===d&&o.status==='Hoàn thành'),out=db.ingredients.filter(x=>x.stock<=x.min);
 if(!isManager()){let mine=ods.filter(o=>o.staffId===user().id);v.innerHTML=pageHead('Tổng quan','Khu vực làm việc của nhân viên',`<button class="primary" onclick="setPage('pos')">＋ Bán hàng</button>`)+`<div class="cards"><div class="card"><div class="metric-label">Đơn của tôi hôm nay</div><div class="metric">${mine.length}</div></div><div class="card"><div class="metric-label">Trạng thái ca</div><div class="metric">${activeShift()?'Đang mở':'Chưa mở'}</div></div></div><div class="panel"><h3>Đơn gần đây của tôi</h3>${orderTable(mine.slice().reverse().slice(0,6),false)}</div>`;return}
 let rev=ods.reduce((a,o)=>a+o.total,0),profit=ods.reduce((a,o)=>a+(o.actualProfit||0),0);
 v.innerHTML=pageHead('Tổng quan','Tình hình kinh doanh hôm nay',`<button class="primary" onclick="setPage('pos')">＋ Bán hàng</button> <button onclick="setPage('staff')">Quản lý tài khoản</button>`)+`<div class="cards"><div class="card"><div class="metric-label">Doanh thu hôm nay</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="metric-label">Lợi nhuận gộp</div><div class="metric">${money(profit)}</div></div><div class="card"><div class="metric-label">Đơn hôm nay</div><div class="metric">${ods.length}</div></div><div class="card"><div class="metric-label">Nguyên liệu cần nhập</div><div class="metric">${out.length}</div></div></div><div class="grid2"><div class="panel"><h3>Đơn gần đây</h3>${orderTable(db.orders.slice().reverse().slice(0,6),true)}</div><div class="panel"><h3>Cảnh báo kho</h3>${out.map(x=>`<div class="statline"><span>${esc(x.name)}</span><b>${x.stock} ${esc(x.unit)}</b></div>`).join('')||'Không có cảnh báo'}</div></div>`;
}

function orderTable(a,showTotal=isManager()){return a.length?`<table><thead><tr><th>Mã đơn</th><th>Thời gian</th><th>Khách hàng</th>${showTotal?'<th>Tổng tiền</th>':''}<th>Trạng thái</th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.code)}</td><td>${o.date} ${o.time}</td><td>${esc(o.customer)}</td>${showTotal?`<td>${money(o.total)}</td>`:''}<td>${esc(o.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có đơn hàng</div>'}

function pos(v){
 v.innerHTML=pageHead('Bán hàng POS','Chọn món, size, topping, đường và đá')+
 `<div class="pos-layout"><div><div class="toolbar"><input class="field" id="pSearch" placeholder="Tìm món..." oninput="filterTiles()"><select class="field" id="pCat" onchange="filterTiles()"><option value="">Tất cả danh mục</option>${[...new Set(db.products.filter(x=>x.active).map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="product-grid" id="tiles">${db.products.filter(x=>x.active).map(x=>`<button class="product-tile" data-name="${esc(x.name.toLowerCase())}" data-cat="${esc(x.category)}" onclick="configureItem('${x.id}')"><div class="product-icon">${x.icon||'🧋'}</div><div class="product-name">${esc(x.name)}</div><div class="product-price">M ${money(x.sizes.M)} · L ${money(x.sizes.L)}</div></button>`).join('')}</div></div>
 <div class="panel"><h3>Đơn hàng hiện tại</h3><div class="form-item"><label>Khách hàng</label><input class="field" id="posCustomer" placeholder="Khách lẻ / tên khách"></div><div class="form-item"><label>Ghi chú đơn hàng</label><textarea class="field" id="posNote" rows="2" placeholder="Ví dụ: ít đường, giao mang đi, khách dặn riêng..."></textarea></div><div id="cartItems" style="margin-top:12px"></div><div class="total-line"><span>Tạm tính</span><b id="subtotal">0 ₫</b></div><div class="total-line"><label>Giảm giá (₫)</label><input class="field" id="discount" type="number" min="0" value="0" style="width:120px" oninput="updateCart()"></div><div class="total-line grand"><span>THANH TOÁN</span><span id="grandTotal">0 ₫</span></div><div class="form-item"><label>Thanh toán</label><select class="field" id="payment"><option>Tiền mặt</option><option>Chuyển khoản</option><option>Ví điện tử</option></select><small class="muted">Chuyển khoản: chỉ xác nhận khi đã kiểm tra tiền vào tài khoản.</small></div><button class="success" style="width:100%;margin-top:13px" onclick="checkout()">Thanh toán & lưu đơn</button><button style="width:100%;margin-top:8px" onclick="cart=[];updateCart()">Xóa đơn hiện tại</button></div></div>`;
 cart=[];updateCart();
}
function filterTiles(){let q=document.getElementById('pSearch').value.toLowerCase(),c=document.getElementById('pCat').value;document.querySelectorAll('.product-tile').forEach(x=>x.classList.toggle('hidden',!x.dataset.name.includes(q)||(c&&x.dataset.cat!==c)))}
function configureItem(id){
 let p=db.products.find(x=>x.id===id),ingOpts=db.ingredients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 showModal(`<h3>Tùy chỉnh món: ${esc(p.name)}</h3><div class="form-grid"><div class="form-item"><label>Size</label><select class="field" id="cSize"><option value="M">Size M · ${money(p.sizes.M)}</option><option value="L">Size L · ${money(p.sizes.L)}</option></select></div><div class="form-item"><label>Số lượng</label><input class="field" id="cQty" type="number" min="1" value="1"></div><div class="form-item"><label>Mức đường</label><select class="field" id="cSugar"><option>100%</option><option>70%</option><option>50%</option><option>30%</option><option>0%</option></select></div><div class="form-item"><label>Mức đá</label><select class="field" id="cIce"><option>100%</option><option>70%</option><option>50%</option><option>30%</option><option>0%</option></select></div></div><div style="margin:15px 0 8px;font-weight:700">Topping thêm</div>${db.toppings.map(t=>`<label style="display:flex;gap:8px;padding:7px 0"><input type="checkbox" class="cTop" value="${t.id}"> ${esc(t.name)} (+${money(t.price)})</label>`).join('')||'<span class="muted">Chưa khai báo topping</span>'}<div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="addConfigured('${id}')">Thêm vào đơn</button></div>`)
}
function addConfigured(id){let p=db.products.find(x=>x.id===id),size=document.getElementById('cSize').value,qty=Math.max(1,Number(document.getElementById('cQty').value)||1),tops=[...document.querySelectorAll('.cTop:checked')].map(x=>x.value),sugar=document.getElementById('cSugar').value,ice=document.getElementById('cIce').value;let topObjs=tops.map(t=>db.toppings.find(x=>x.id===t));let key=[id,size,tops.sort().join(','),sugar,ice].join('|'),old=cart.find(x=>x.key===key);let item={key,id,name:p.name,size,qty,unitPrice:Number(p.sizes[size])+topObjs.reduce((a,t)=>a+t.price,0),basePrice:Number(p.sizes[size]),toppings:topObjs.map(t=>({id:t.id,name:t.name,price:t.price,recipe:clone(t.recipe)})),sugar,ice,recipe:clone(p.recipe||{}),factor:size==='L'?(Number(p.factor)||1.25):1};if(old)old.qty+=qty;else cart.push(item);closeModal();updateCart()}
function recipeFor(item){let r={};Object.entries(item.recipe||{}).forEach(([k,v])=>r[k]=(Number(v)||0)*item.factor);item.toppings.forEach(t=>Object.entries(t.recipe||{}).forEach(([k,v])=>r[k]=(r[k]||0)+(Number(v)||0)));let sugar=Number(String(item.sugar||'100').replace('%',''))/100,ice=Number(String(item.ice||'100').replace('%',''))/100;Object.keys(r).forEach(id=>{let ing=db.ingredients.find(x=>x.id===id),n=(ing?.name||'').toLowerCase();if(n.includes('đường')||n.includes('sugar'))r[id]*=sugar;if(n.includes('đá')||n.includes('ice'))r[id]*=ice});return r}
function itemCost(item){return Object.entries(recipeFor(item)).reduce((a,[id,q])=>{let ing=db.ingredients.find(x=>x.id===id);return a+(ing?(Number(ing.cost)||0)*q:0)},0)}
function updateCart(){let el=document.getElementById('cartItems');if(!el)return;el.innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><div style="min-width:0"><b>${esc(x.name)} · ${x.size}</b><div class="muted">${x.toppings.map(t=>esc(t.name)).join(', ')||'Không topping'} · Đường ${x.sugar} · Đá ${x.ice}</div><div class="muted">${money(x.unitPrice)} × ${x.qty}</div></div><div class="qty"><button onclick="qtyCart('${esc(x.key)}',-1)">−</button><b>${x.qty}</b><button onclick="qtyCart('${esc(x.key)}',1)">＋</button></div></div>`).join(''):'<div class="empty">Chưa có sản phẩm</div>';let s=cart.reduce((a,x)=>a+x.unitPrice*x.qty,0),d=Math.max(0,Number(document.getElementById('discount')?.value)||0);document.getElementById('subtotal').textContent=money(s);document.getElementById('grandTotal').textContent=money(Math.max(0,s-d))}
function qtyCart(k,d){let x=cart.find(x=>x.key===k);if(x){x.qty+=d;if(x.qty<=0)cart=cart.filter(a=>a.key!==k)}updateCart()}
function checkout(){
 if(!requireShift()||!cart.length)return;
 let sub=cart.reduce((a,x)=>a+x.unitPrice*x.qty,0),discount=Math.max(0,Number(document.getElementById('discount').value)||0),total=sub-discount;
 if(discount>sub)return alert('Giảm giá lớn hơn tạm tính.');
 let need={};cart.forEach(item=>Object.entries(recipeFor(item)).forEach(([id,q])=>need[id]=(need[id]||0)+q*item.qty));
 let missing=Object.entries(need).filter(([id,q])=>{let ing=db.ingredients.find(x=>x.id===id);return !ing||ing.stock<q});
 if(missing.length)return alert('Không đủ tồn kho nguyên liệu: '+missing.map(([id,q])=>{let x=db.ingredients.find(z=>z.id===id);return (x?.name||id)+' (cần '+q.toFixed(3)+' '+(x?.unit||'')+')'}).join('; ')+'. Vui lòng nhập kho hoặc điều chỉnh công thức.');
 let payment=document.getElementById('payment').value;if(payment!=='Tiền mặt'&&!confirm('Bạn đã kiểm tra và xác nhận nhận đủ '+money(total)+' qua '+payment+'?'))return;let now=new Date(),items=clone(cart),actualCost=items.reduce((a,x)=>a+itemCost(x)*x.qty,0);
 Object.entries(need).forEach(([id,q])=>{let x=db.ingredients.find(z=>z.id===id);x.stock-=q});
 let o={id:uid(),code:'MT'+today().replaceAll('-','').slice(2)+'-'+String(db.orders.length+1).padStart(4,'0'),date:today(),time:now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}),customer:document.getElementById('posCustomer').value.trim()||'Khách lẻ',items,subtotal:sub,discount,total,actualCost,actualProfit:total-actualCost,payment:document.getElementById('payment').value,note:(document.getElementById('posNote')?.value||'').trim(),status:'Hoàn thành',shiftId:activeShift().id,staffId:user().id,ingredientUsage:need};
 db.orders.push(o);db.cash.push({id:uid(),date:today(),time:o.time,type:'Thu',category:'Doanh thu bán hàng',amount:total,note:o.code,source:'order',sourceId:o.id});activeShift().orders=(activeShift().orders||0)+1;
 if(o.customer!=='Khách lẻ'){let c=db.customers.find(x=>x.name===o.customer);if(c){c.orders++;c.spent+=total}else db.customers.push({id:uid(),name:o.customer,phone:'',orders:1,spent:total})}
 save();cart=[];alert('Thanh toán thành công!\nMã đơn: '+o.code+'\nSố tiền: '+money(total)+'\nHình thức: '+o.payment);render('pos')
}
function orders(v){v.innerHTML=pageHead('Đơn hàng','Lịch sử bán hàng')+`<div class="panel"><div class="toolbar"><input class="field" id="oq" placeholder="Mã đơn / khách hàng" oninput="filterOrders()"><label>Từ <input class="field" type="date" id="odFrom" value="${today().slice(0,8)}01"></label><label>Đến <input class="field" type="date" id="odTo" value="${today()}"></label><button onclick="exportOrdersExcel()">Xuất Excel</button><input class="field" type="date" id="od" value="${today()}" onchange="filterOrders()"><select class="field" id="os" onchange="filterOrders()"><option value="">Tất cả trạng thái</option><option>Hoàn thành</option><option>Đã hủy</option></select></div><div id="ot">${orderDetail(db.orders.slice().reverse())}</div></div>`}

function orderDetail(a){if(!isManager())a=a.filter(o=>o.staffId===user().id);return a.length?`<div class="table-wrap"><table><thead><tr><th>Mã đơn</th><th>Ngày giờ</th><th>Khách</th><th>Thanh toán</th>${isManager()?'<th>Tổng tiền</th><th>Giá vốn</th><th>Lợi nhuận</th>':''}<th>Trạng thái</th><th></th></tr></thead><tbody>${a.map(o=>`<tr><td>${esc(o.code)}</td><td>${o.date} ${o.time}</td><td>${esc(o.customer)}</td><td>${esc(o.payment)}</td>${isManager()?`<td>${money(o.total)}</td><td>${money(o.actualCost||0)}</td><td>${money(o.actualProfit||0)}</td>`:''}<td>${esc(o.status)}</td><td><button class="small" onclick="viewOrder('${o.id}')">Chi tiết</button>${isManager()&&o.status==='Hoàn thành'?` <button class="small danger" onclick="cancelOrder('${o.id}')">Hủy</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có đơn hàng</div>'}

function filterOrders(){let q=document.getElementById('oq').value.toLowerCase(),d=document.getElementById('od').value,s=document.getElementById('os').value;document.getElementById('ot').innerHTML=orderDetail(db.orders.slice().reverse().filter(o=>(!q||o.code.toLowerCase().includes(q)||o.customer.toLowerCase().includes(q))&&(!d||o.date===d)&&(!s||o.status===s)))}
function viewOrder(id){let o=db.orders.find(x=>x.id===id);if(!o||(!isManager()&&o.staffId!==user().id))return alert('Không có quyền xem đơn này.');showModal(`<h3>Chi tiết ${esc(o.code)}</h3><p class="muted">${o.date} ${o.time} · ${esc(o.customer)} · ${esc(o.payment)}</p>${o.items.map(i=>`<div class="statline"><span>${esc(i.name)} size ${i.size} × ${i.qty}</span><span>${i.sugar} đường · ${i.ice} đá</span></div>`).join('')}<div class="panel"><b>Ghi chú đơn hàng</b><p>${esc(o.note||'Không có ghi chú')}</p></div>${isManager()?`<div class="statline"><span>Tổng tiền</span><b>${money(o.total)}</b></div><div class="statline"><span>Giá vốn</span><b>${money(o.actualCost||0)}</b></div><div class="statline"><span>Lợi nhuận</span><b>${money(o.actualProfit||0)}</b></div>`:''}<div class="modal-actions"><button class="primary" onclick="closeModal()">Đóng</button></div>`)}

function cancelOrder(id){if(!isManager())return alert("Chỉ quản lý được hủy đơn.");if(!isManager())return alert('Chỉ quản lý được hủy đơn.');let o=db.orders.find(x=>x.id===id);if(!confirm('Hủy đơn? Hệ thống sẽ hoàn lại nguyên liệu vào kho và ghi khoản hoàn tiền.'))return;if(o.status!=='Hoàn thành')return;Object.entries(o.ingredientUsage||{}).forEach(([id,q])=>{let x=db.ingredients.find(z=>z.id===id);if(x)x.stock+=q});o.status='Đã hủy';db.cash.push({id:uid(),date:today(),time:new Date().toLocaleTimeString('vi-VN'),type:'Chi',category:'Hoàn tiền đơn hủy',amount:o.total,note:o.code,source:'cancel',sourceId:o.id});save();render('orders')}
function products(v){v.innerHTML=pageHead('Sản phẩm & công thức','Giá size M/L, định lượng nguyên liệu cho size M và topping',`<button class="primary" onclick="productModal()">＋ Thêm món</button> <button onclick="toppingModal()">＋ Topping</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Món</th><th>Danh mục</th><th>Giá M</th><th>Giá L</th><th>Công thức</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${p.icon} <b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${money(p.sizes.M)}</td><td>${money(p.sizes.L)}</td><td>${Object.keys(p.recipe||{}).length} nguyên liệu</td><td><button class="small" onclick="productModal('${p.id}')">Sửa</button> <button class="small danger" onclick="deleteProduct('${p.id}')">Xóa</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>Danh sách topping</h3>${db.toppings.map(t=>`<div class="statline"><span><b>${esc(t.name)}</b> · ${money(t.price)}</span><span><button class="small" onclick="toppingModal('${t.id}')">Sửa</button> <button class="small danger" onclick="deleteTopping('${t.id}')">Xóa</button></span></div>`).join('')||'<div class="empty">Chưa có topping</div>'}<p class="footer-note">Quy ước: công thức nhập theo 1 ly size M. Size L hiện được tính theo hệ số 1,25; có thể thay đổi hệ số ở phần sửa món.</p></div>`}
function recipeEditor(recipe){return `<div class="form-item full"><label>Định lượng cho 1 ly size M (đúng đơn vị kho)</label><div class="recipe-list">${db.ingredients.map(i=>`<div class="recipe-item"><label>${esc(i.name)} (${esc(i.unit)})</label><input class="field recipeQty" data-ing="${i.id}" type="number" min="0" step="0.001" value="${Number(recipe?.[i.id]||0)}"></div>`).join('')}</div></div>`}
function productModal(id){let p=db.products.find(x=>x.id===id)||{name:'',category:'Trà sữa',icon:'🧋',sizes:{M:30000,L:36000},factor:1.25,recipe:{},active:true};showModal(`<h3>${id?'Sửa món & công thức':'Thêm món & công thức'}</h3><div class="form-grid"><div class="form-item full"><label>Tên món</label><input class="field" id="mName" value="${esc(p.name)}"></div><div class="form-item"><label>Danh mục</label><input class="field" id="mCat" value="${esc(p.category)}"></div><div class="form-item"><label>Icon</label><input class="field" id="mIcon" value="${esc(p.icon)}"></div><div class="form-item"><label>Giá size M</label><input class="field" id="mM" type="number" value="${p.sizes.M}"></div><div class="form-item"><label>Giá size L</label><input class="field" id="mL" type="number" value="${p.sizes.L}"></div><div class="form-item"><label>Hệ số định lượng size L</label><input class="field" id="mFactor" type="number" step="0.05" value="${p.factor||1.25}"></div><div class="form-item"><label>Trạng thái</label><select class="field" id="mActive"><option value="true" ${p.active?'selected':''}>Đang bán</option><option value="false" ${!p.active?'selected':''}>Ngừng bán</option></select></div>${recipeEditor(p.recipe)}</div><div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="saveProduct('${id||''}')">Lưu món</button></div>`)}
function saveProduct(id){let name=document.getElementById('mName').value.trim(),recipe={};document.querySelectorAll('.recipeQty').forEach(x=>{if(Number(x.value)>0)recipe[x.dataset.ing]=Number(x.value)});let x={id:id||uid(),name,category:document.getElementById('mCat').value.trim()||'Khác',icon:document.getElementById('mIcon').value||'🧋',sizes:{M:Number(document.getElementById('mM').value),L:Number(document.getElementById('mL').value)},factor:Number(document.getElementById('mFactor').value)||1.25,recipe,active:document.getElementById('mActive').value==='true'};if(!name||x.sizes.M<0||x.sizes.L<0)return alert('Kiểm tra tên món và giá bán.');let old=db.products.find(a=>a.id===id);if(old)Object.assign(old,x);else db.products.push(x);save();closeModal();render('products')}
function deleteProduct(id){if(isManager()&&confirm('Xóa món này?')){db.products=db.products.filter(x=>x.id!==id);save();render('products')}}
function toppingModal(id){let t=db.toppings.find(x=>x.id===id)||{name:'',price:5000,recipe:{}};showModal(`<h3>${id?'Sửa topping':'Thêm topping'}</h3><div class="form-grid"><div class="form-item full"><label>Tên topping</label><input class="field" id="tName" value="${esc(t.name)}"></div><div class="form-item full"><label>Giá bán thêm</label><input class="field" id="tPrice" type="number" value="${t.price}"></div>${recipeEditor(t.recipe)}</div><div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="saveTopping('${id||''}')">Lưu topping</button></div>`)}
function saveTopping(id){let recipe={};document.querySelectorAll('.recipeQty').forEach(x=>{if(Number(x.value)>0)recipe[x.dataset.ing]=Number(x.value)});let x={id:id||uid(),name:document.getElementById('tName').value.trim(),price:Number(document.getElementById('tPrice').value),recipe};if(!x.name)return alert('Nhập tên topping.');let old=db.toppings.find(a=>a.id===id);if(old)Object.assign(old,x);else db.toppings.push(x);save();closeModal();render('products')}
function deleteTopping(id){if(confirm('Xóa topping?')){db.toppings=db.toppings.filter(x=>x.id!==id);save();render('products')}}
function inventory(v){v.innerHTML=pageHead('Nguyên liệu','Tồn kho thực tế, định mức cảnh báo và giá vốn',`<button class="primary" onclick="ingredientModal()">＋ Nguyên liệu</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Nguyên liệu</th><th>Đơn vị</th><th>Tồn kho</th><th>Tối thiểu</th><th>Giá vốn/đv</th><th>Trạng thái</th><th></th></tr></thead><tbody>${db.ingredients.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.unit)}</td><td>${Number(x.stock).toFixed(3)}</td><td>${x.min}</td><td>${money(x.cost)}</td><td><span class="pill ${x.stock<=x.min?'red':'green'}">${x.stock<=x.min?'Sắp hết':'Bình thường'}</span></td><td><button class="small" onclick="ingredientModal('${x.id}')">Sửa</button></td></tr>`).join('')}</tbody></table></div></div><div class="notice">Khi thanh toán đơn, phần mềm tự động trừ kho theo công thức. Nhập hàng được cộng kho theo phiếu nhập đã lưu.</div>`}
function ingredientModal(id){let x=db.ingredients.find(a=>a.id===id)||{name:'',unit:'kg',stock:0,min:0,cost:0};showModal(`<h3>${id?'Sửa nguyên liệu':'Thêm nguyên liệu'}</h3><div class="form-grid"><div class="form-item full"><label>Tên</label><input class="field" id="igName" value="${esc(x.name)}"></div><div class="form-item"><label>Đơn vị</label><input class="field" id="igUnit" value="${esc(x.unit)}"></div><div class="form-item"><label>Tồn kho</label><input class="field" id="igStock" type="number" step="0.001" value="${x.stock}"></div><div class="form-item"><label>Tồn tối thiểu</label><input class="field" id="igMin" type="number" step="0.001" value="${x.min}"></div><div class="form-item"><label>Giá vốn/đơn vị</label><input class="field" id="igCost" type="number" value="${x.cost}"></div></div><div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="saveIngredient('${id||''}')">Lưu</button></div>`)}
function saveIngredient(id){let x={id:id||uid(),name:document.getElementById('igName').value.trim(),unit:document.getElementById('igUnit').value.trim(),stock:Number(document.getElementById('igStock').value),min:Number(document.getElementById('igMin').value),cost:Number(document.getElementById('igCost').value)};if(!x.name||!x.unit)return alert('Nhập tên và đơn vị.');let old=db.ingredients.find(a=>a.id===id);if(old)Object.assign(old,x);else db.ingredients.push(x);save();closeModal();render('inventory')}
function purchases(v){let due=db.purchases.reduce((a,x)=>a+(x.total-x.paid),0);v.innerHTML=pageHead('Nhập hàng & nhà cung cấp','Nhập kho, theo dõi đã thanh toán và công nợ',`<button onclick="supplierModal()">＋ Nhà cung cấp</button> <button class="primary" onclick="purchaseModal()">＋ Tạo phiếu nhập</button>`)+`<div class="cards"><div class="card"><div class="metric-label">Tổng công nợ phải trả</div><div class="metric">${money(due)}</div></div><div class="card"><div class="metric-label">Nhà cung cấp</div><div class="metric">${db.suppliers.length}</div></div><div class="card"><div class="metric-label">Phiếu nhập</div><div class="metric">${db.purchases.length}</div></div><div class="card"><div class="metric-label">Giá trị nhập hàng</div><div class="metric">${money(db.purchases.reduce((a,x)=>a+x.total,0))}</div></div></div><div class="panel"><h3>Công nợ theo nhà cung cấp</h3>${db.suppliers.map(s=>{let d=db.purchases.filter(p=>p.supplierId===s.id).reduce((a,p)=>a+p.total-p.paid,0);return `<div class="statline"><span>${esc(s.name)} · ${esc(s.phone||'')}</span><b>${money(d)}</b></div>`}).join('')||'<div class="empty">Chưa có nhà cung cấp</div>'}</div><div class="panel"><h3>Lịch sử phiếu nhập</h3>${db.purchases.length?`<table><thead><tr><th>Mã phiếu</th><th>Ngày</th><th>Nhà cung cấp</th><th>Tổng tiền</th><th>Đã trả</th><th>Còn nợ</th><th></th></tr></thead><tbody>${db.purchases.slice().reverse().map(x=>`<tr><td>${x.code}</td><td>${x.date}</td><td>${esc(db.suppliers.find(s=>s.id===x.supplierId)?.name||'')}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.total-x.paid)}</td><td><button class="small" onclick="paySupplier('${x.id}')">Thanh toán nợ</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Chưa có phiếu nhập</div>'}</div>`}
function supplierModal(){showModal(`<h3>Thêm nhà cung cấp</h3><div class="form-item"><label>Tên nhà cung cấp</label><input class="field" id="sName"></div><div class="form-item"><label>Số điện thoại</label><input class="field" id="sPhone"></div><div class="form-item"><label>Địa chỉ</label><input class="field" id="sAddress"></div><div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="saveSupplier()">Lưu</button></div>`)}
function saveSupplier(){let name=document.getElementById('sName').value.trim();if(!name)return alert('Nhập tên nhà cung cấp.');db.suppliers.push({id:uid(),name,phone:document.getElementById('sPhone').value,address:document.getElementById('sAddress').value});save();closeModal();render('purchases')}
function purchaseModal(){if(!db.suppliers.length)return alert('Hãy tạo nhà cung cấp trước.');let rows=db.ingredients.map(x=>`<div class="recipe-item"><label>${esc(x.name)} (${x.unit})</label><input type="number" class="field purQty" data-id="${x.id}" min="0" step="0.001" placeholder="Số lượng"><input type="number" class="field purCost" data-id="${x.id}" value="${x.cost}" placeholder="Đơn giá"></div>`).join('');showModal(`<h3>Tạo phiếu nhập kho</h3><div class="form-item"><label>Nhà cung cấp</label><select class="field" id="purSupplier">${db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="form-item" style="margin-top:10px"><label>Số tiền đã thanh toán</label><input class="field" id="purPaid" type="number" value="0"></div><div style="font-weight:700;margin:15px 0 8px">Chi tiết hàng nhập · nhập số lượng và đơn giá</div><div class="recipe-list">${rows}</div><div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="savePurchase()">Lưu phiếu nhập</button></div>`)}
function savePurchase(){let lines=[];document.querySelectorAll('.purQty').forEach(el=>{let q=Number(el.value)||0;if(q>0){let cost=Number(document.querySelector('.purCost[data-id="'+el.dataset.id+'"]').value)||0;lines.push({ingredientId:el.dataset.id,qty:q,cost})}});if(!lines.length)return alert('Nhập ít nhất một mặt hàng.');let total=lines.reduce((a,x)=>a+x.qty*x.cost,0),paid=Number(document.getElementById('purPaid').value)||0;if(paid>total||paid<0)return alert('Số đã trả không hợp lệ.');let id=uid(),now=today(),p={id,code:'PN-'+now.replaceAll('-','')+'-'+(db.purchases.length+1),date:now,supplierId:document.getElementById('purSupplier').value,lines,total,paid};lines.forEach(l=>{let x=db.ingredients.find(i=>i.id===l.ingredientId);x.stock+=l.qty;x.cost=l.cost});db.purchases.push(p);if(paid)db.cash.push({id:uid(),date:now,time:'',type:'Chi',category:'Thanh toán nhập hàng',amount:paid,note:p.code,source:'purchase',sourceId:id});save();closeModal();render('purchases')}
function paySupplier(id){let p=db.purchases.find(x=>x.id===id),due=p.total-p.paid;if(due<=0)return alert('Phiếu này đã thanh toán đủ.');let n=prompt('Còn nợ '+money(due)+'. Nhập số tiền thanh toán:',''+due);if(n===null)return;let a=Number(n);if(!a||a<=0||a>due)return alert('Số tiền không hợp lệ.');p.paid+=a;db.cash.push({id:uid(),date:today(),time:'',type:'Chi',category:'Trả công nợ nhà cung cấp',amount:a,note:p.code,source:'supplier-payment',sourceId:id});save();render('purchases')}
function cash(v){let ins=db.cash.filter(x=>x.type==='Thu').reduce((a,x)=>a+x.amount,0),outs=db.cash.filter(x=>x.type==='Chi').reduce((a,x)=>a+x.amount,0);v.innerHTML=pageHead('Thu chi','Sổ quỹ tiền mặt và các khoản thu/chi',`<button class="primary" onclick="cashModal()">＋ Ghi nhận thu/chi</button>`)+`<div class="cards"><div class="card"><div class="metric-label">Tổng thu</div><div class="metric">${money(ins)}</div></div><div class="card"><div class="metric-label">Tổng chi</div><div class="metric">${money(outs)}</div></div><div class="card"><div class="metric-label">Chênh lệch thu - chi</div><div class="metric">${money(ins-outs)}</div></div><div class="card"><div class="metric-label">Số giao dịch</div><div class="metric">${db.cash.length}</div></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Ngày</th><th>Loại</th><th>Danh mục</th><th>Nội dung</th><th>Số tiền</th></tr></thead><tbody>${db.cash.slice().reverse().map(x=>`<tr><td>${x.date} ${x.time||''}</td><td><span class="pill ${x.type==='Thu'?'green':'red'}">${x.type}</span></td><td>${esc(x.category)}</td><td>${esc(x.note)}</td><td><b>${money(x.amount)}</b></td></tr>`).join('')}</tbody></table></div></div><div class="notice">Doanh thu đơn hàng và tiền trả nhà cung cấp tự động ghi sổ. Không ghi thêm lần nữa các khoản này để tránh trùng thu/chi.</div>`}
function cashModal(){showModal(`<h3>Ghi nhận thu/chi khác</h3><div class="form-grid"><div class="form-item"><label>Loại giao dịch</label><select class="field" id="ct"><option>Thu</option><option>Chi</option></select></div><div class="form-item"><label>Ngày</label><input class="field" id="cd" type="date" value="${today()}"></div><div class="form-item"><label>Danh mục</label><input class="field" id="cc" placeholder="Điện nước, thuê nhà..."></div><div class="form-item"><label>Số tiền</label><input class="field" id="ca" type="number" min="1"></div><div class="form-item full"><label>Diễn giải</label><input class="field" id="cn"></div></div><div class="modal-actions"><button onclick="closeModal()">Hủy</button><button class="primary" onclick="saveCash()">Lưu giao dịch</button></div>`)}
function saveCash(){let amount=Number(document.getElementById('ca').value);if(amount<=0)return alert('Nhập số tiền hợp lệ.');db.cash.push({id:uid(),date:document.getElementById('cd').value,type:document.getElementById('ct').value,category:document.getElementById('cc').value||'Khác',amount,note:document.getElementById('cn').value,source:'manual'});save();closeModal();render('cash')}
function shifts(v){let open=activeShift(),allOpen=db.shifts.filter(s=>s.status==='Đang mở'),visible=isManager()?db.shifts:db.shifts.filter(s=>s.staffId===user().id);let opener=open?db.staff.find(x=>x.id===open.staffId)?.name||'Nhân viên':'';let canClose=open&&(isManager()||open.staffId===user().id);v.innerHTML=pageHead('Ca làm & đối soát','Chấm công độc lập; một két tiền chỉ có một ca bán hàng đang mở',isManager()?`<label>Từ <input class="field" type="date" id="shFrom" value="${today().slice(0,8)}01"></label> <label>Đến <input class="field" type="date" id="shTo" value="${today()}"></label> <button onclick="exportShiftsExcel()">↓ Xuất Excel</button>`:'')+(open?`<div class="panel"><h3>Ca bán hàng đang mở</h3><p>Người mở ca: <b>${esc(opener)}</b></p><p>Bắt đầu: ${open.startDate} ${open.startTime} · Tiền mặt đầu ca: ${money(open.openingCash)}</p><p>Số đơn trong ca: ${shiftOrders(open.id).length}</p>${canClose?`<button class="success" onclick="closeShift()">Chốt ca cuối ngày</button>`:`<p class="muted">Bạn đang sử dụng ca chung của cửa hàng. Chỉ người mở ca hoặc quản lý được chốt ca.</p>`}</div>`:`<div class="panel"><h3>Mở ca bán hàng</h3><p class="muted">Chỉ một tài khoản được mở ca tại một thời điểm. Khi ca đang mở, các nhân viên khác vẫn có thể đăng nhập, bán hàng và chấm công riêng.</p><label>Tiền mặt đầu ca</label><input class="field" type="number" min="0" id="openingCash" value="0"><button class="primary" onclick="openShift()">Mở ca</button></div>`)+(isManager()?`<div class="panel"><h3>Các ca đang mở (${allOpen.length})</h3>${allOpen.map(s=>`<div class="statline"><span>${esc(db.staff.find(x=>x.id===s.staffId)?.name||'')} · ${s.startDate}</span><b>${shiftOrders(s.id).length} đơn</b></div>`).join('')||'Không có ca đang mở'}</div>`:'')+`<div class="panel"><h3>Lịch sử đối soát ca</h3>${visible.slice().reverse().map(s=>`<div style="padding:14px 0;border-bottom:1px solid var(--line)"><b>${esc(db.staff.find(x=>x.id===s.staffId)?.name||'')} · ${s.startDate} · ${s.status}</b><div class="statline"><span>Tiền mặt đầu ca</span><b>${money(s.openingCash)}</b></div>${isManager()?`<div class="statline"><span>Tiền mặt bán hàng</span><b>${money(shiftPayment(s.id,'Tiền mặt'))}</b></div><div class="statline"><span>Chuyển khoản ghi nhận</span><b>${money(shiftPayment(s.id,'Chuyển khoản'))}</b></div><div class="statline"><span>Ví điện tử ghi nhận</span><b>${money(shiftPayment(s.id,'Ví điện tử'))}</b></div>`:''}${s.status==='Đã chốt'?`<div class="statline"><span>Giờ mở ca</span><b>${esc(s.startTime||'')}</b></div><div class="statline"><span>Ngày/giờ chốt ca</span><b>${esc(s.endDate||'')} ${esc(s.endTime||'')}</b></div><div class="statline"><span>Người chốt ca</span><b>${esc(s.closedByName||db.staff.find(x=>x.id===s.closedBy)?.name||'')}</b></div><div class="statline"><span>Số đơn trong ca</span><b>${s.orderCount??shiftOrders(s.id).length}</b></div><div class="statline"><span>Tiền mặt thực đếm</span><b>${money(s.actualCash)}</b></div><div class="statline"><span>Chênh lệch tiền mặt</span><b>${money(s.difference)}</b></div><div class="statline"><span>Chuyển khoản</span><b>${money(s.transferTotal||0)} · ${s.transferVerified?'Đã đối chiếu':'Chưa đối chiếu'}</b></div><div class="statline"><span>Ví điện tử</span><b>${money(s.walletTotal||0)} · ${s.walletVerified?'Đã đối chiếu':'Chưa đối chiếu'}</b></div>${s.closeNote?`<p class="muted">Ghi chú: ${esc(s.closeNote)}</p>`:''}`:''}</div>`).join('')||'<div class="empty">Chưa có ca</div>'}</div>`}

function shiftOrders(id){return db.orders.filter(o=>o.shiftId===id&&o.status==='Hoàn thành')}
function shiftPayment(id,payment){return shiftOrders(id).filter(o=>o.payment===payment).reduce((a,o)=>a+o.total,0)}
function shiftSales(id){return shiftOrders(id).reduce((a,o)=>a+o.total,0)}
function openShift(){if(!user())return alert('Vui lòng đăng nhập.');let existing=activeShift();if(existing)return alert('Không thể mở ca mới. Đang có một ca do '+(db.staff.find(x=>x.id===existing.staffId)?.name||'nhân viên khác')+' mở. Ca hiện tại phải được chốt trước.');let el=document.getElementById('openingCash');if(!el)return;let n=Number(el.value)||0;if(n<0)return alert('Tiền mặt đầu ca không hợp lệ.');let d=new Date(),s={id:uid(),staffId:user().id,startDate:today(),startTime:d.toLocaleTimeString('vi-VN'),openingCash:n,status:'Đang mở'};db.shifts.push(s);db.currentShiftId=s.id;save();render('shifts')}
function closeShift(){let s=activeShift();if(!s)return;if(!isManager()&&s.staffId!==user().id)return alert('Chỉ người mở ca hoặc quản lý được chốt ca.');let cash=shiftPayment(s.id,'Tiền mặt'),bank=shiftPayment(s.id,'Chuyển khoản'),wallet=shiftPayment(s.id,'Ví điện tử'),expected=s.openingCash+cash,orders=shiftOrders(s.id),opener=db.staff.find(x=>x.id===s.staffId)?.name||'Không rõ',now=new Date(),startLabel=s.startDate+' '+s.startTime;let counts=['Tiền mặt','Chuyển khoản','Ví điện tử'].map(method=>({method,items:orders.filter(o=>o.payment===method)}));showModal(`<h3>Chốt ca & đối soát chi tiết</h3><div class="panel"><h4>Thông tin ca</h4><div class="statline"><span>Mã ca</span><b>${esc(s.id)}</b></div><div class="statline"><span>Ngày mở ca</span><b>${esc(s.startDate)}</b></div><div class="statline"><span>Giờ mở ca</span><b>${esc(s.startTime)}</b></div><div class="statline"><span>Người mở ca</span><b>${esc(opener)}</b></div><div class="statline"><span>Thời điểm chốt dự kiến</span><b>${now.toLocaleDateString('vi-VN')} ${now.toLocaleTimeString('vi-VN')}</b></div><div class="statline"><span>Tổng số đơn hoàn thành</span><b>${orders.length}</b></div></div><div class="panel"><h4>Đối soát tiền mặt</h4><div class="statline"><span>Tiền mặt đầu ca</span><b>${money(s.openingCash)}</b></div><div class="statline"><span>Thu từ đơn tiền mặt (${counts[0].items.length} đơn)</span><b>${money(cash)}</b></div><div class="statline"><span><b>Tiền mặt dự kiến trong két</b></span><b>${money(expected)}</b></div><div class="form-item"><label>Tiền mặt thực tế kiểm đếm cuối ca (₫)</label><input class="field" id="actualCash" type="number" min="0" placeholder="Nhập tổng tiền thực đếm"></div><p class="muted">Chênh lệch sẽ được tính bằng tiền thực đếm trừ tiền mặt dự kiến.</p></div><div class="panel"><h4>Đối soát không dùng tiền mặt</h4><div class="statline"><span>Chuyển khoản (${counts[1].items.length} đơn)</span><b>${money(bank)}</b></div><label><input type="checkbox" id="bankVerified" ${bank===0?'checked':''}> Đã đối chiếu giao dịch chuyển khoản với tài khoản ngân hàng</label><div class="statline"><span>Ví điện tử (${counts[2].items.length} đơn)</span><b>${money(wallet)}</b></div><label><input type="checkbox" id="walletVerified" ${wallet===0?'checked':''}> Đã đối chiếu giao dịch ví điện tử</label><p class="muted">Ứng dụng offline không tự xác minh tiền vào ngân hàng. Chỉ đánh dấu đã đối chiếu sau khi kiểm tra ứng dụng ngân hàng thực tế.</p></div><div class="form-item"><label>Ghi chú bàn giao / chênh lệch</label><textarea class="field" id="shiftCloseNote" rows="2" placeholder="Ví dụ: thiếu tiền, tiền lẻ bàn giao, giao dịch cần kiểm tra..."></textarea></div><div class="modal-actions"><button onclick="closeModal()">Quay lại</button><button class="success" onclick="confirmCloseShift()">Xác nhận chốt ca</button></div>`)}
function confirmCloseShift(){let s=activeShift();if(!s)return;if(!isManager()&&s.staffId!==user().id)return alert('Chỉ người mở ca hoặc quản lý được chốt ca.');let field=document.getElementById('actualCash');if(!field||field.value.trim()==='')return alert('Vui lòng nhập số tiền mặt thực đếm.');let actual=Number(field.value);if(!Number.isFinite(actual)||actual<0)return alert('Tiền mặt không hợp lệ.');let expected=s.openingCash+shiftPayment(s.id,'Tiền mặt'),now=new Date();s.actualCash=actual;s.expectedCash=expected;s.difference=actual-expected;s.transferTotal=shiftPayment(s.id,'Chuyển khoản');s.walletTotal=shiftPayment(s.id,'Ví điện tử');s.transferVerified=document.getElementById('bankVerified').checked;s.walletVerified=document.getElementById('walletVerified').checked;s.endDate=now.toLocaleDateString('sv-SE');s.endTime=now.toLocaleTimeString('vi-VN');s.closedAtISO=now.toISOString();s.closedBy=user().id;s.closedByName=user().name;s.closeNote=document.getElementById('shiftCloseNote')?.value||'';s.orderCount=shiftOrders(s.id).length;s.cashOrderCount=shiftOrders(s.id).filter(o=>o.payment==='Tiền mặt').length;s.bankOrderCount=shiftOrders(s.id).filter(o=>o.payment==='Chuyển khoản').length;s.walletOrderCount=shiftOrders(s.id).filter(o=>o.payment==='Ví điện tử').length;s.status='Đã chốt';db.currentShiftId=null;save();closeModal();render('shifts');alert('Đã chốt ca lúc '+s.endTime+'.\nTiền mặt dự kiến: '+money(expected)+'\nTiền mặt thực đếm: '+money(actual)+'\nChênh lệch: '+money(s.difference)+(s.transferVerified?'':'\\nChuyển khoản chưa đối chiếu đủ.'))}

function attendance(v){
 let mine=db.attendance.filter(a=>a.staffId===user().id),open=mine.find(a=>!a.clockOut);
 let totalMs=mine.filter(a=>a.clockOut).reduce((s,a)=>s+(new Date(a.clockOutISO)-new Date(a.clockInISO)),0);
 let rows=(isManager()?db.attendance.slice().reverse():mine.slice().reverse());
 v.innerHTML=pageHead('Chấm công','Ghi nhận giờ vào làm, giờ ra về và tổng thời gian làm việc')+
 `<div class="cards"><div class="card"><div class="metric-label">Trạng thái hiện tại</div><div class="metric" style="font-size:19px">${open?'Đang làm':'Chưa vào ca'}</div><div class="metric-note">${open?'Vào lúc '+open.clockIn:'Nhân viên: '+esc(user().name)}</div></div><div class="card"><div class="metric-label">Tổng giờ đã chấm</div><div class="metric">${(totalMs/3600000).toFixed(1)} giờ</div><div class="metric-note">Tổng các lượt đã kết thúc</div></div></div>
 <div class="panel"><h3>Chấm công của ${esc(user().name)}</h3>${open?`<div class="notice">Bạn đã chấm công vào lúc ${open.date} ${open.clockIn}. Nhấn nút dưới đây khi kết thúc làm việc.</div><button class="danger" onclick="clockOut()">Chấm công ra</button>`:`<div class="notice">Nhấn chấm công vào khi bắt đầu làm việc. Mỗi tài khoản chỉ có một lượt chấm công đang mở.</div><button class="success" onclick="clockIn()">Chấm công vào</button>`}</div>
 <div class="panel"><h3>${isManager()?'Bảng chấm công toàn bộ nhân viên':'Lịch sử chấm công của bạn'}</h3>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Nhân viên</th><th>Ngày</th><th>Giờ vào</th><th>Giờ ra</th><th>Tổng giờ</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(a=>{let ms=a.clockOutISO?new Date(a.clockOutISO)-new Date(a.clockInISO):Date.now()-new Date(a.clockInISO);return `<tr><td>${esc(db.staff.find(s=>s.id===a.staffId)?.name||'')}</td><td>${a.date}</td><td>${a.clockIn}</td><td>${a.clockOut||'-'}</td><td>${(ms/3600000).toFixed(2)} giờ</td><td><span class="pill ${a.clockOut?'green':'red'}">${a.clockOut?'Đã ra':'Đang làm'}</span></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu chấm công</div>'}</div>`;
}
function clockIn(){
 if(db.attendance.some(a=>a.staffId===user().id&&!a.clockOut))return alert('Bạn đã chấm công vào và chưa chấm công ra.');
 let d=new Date();db.attendance.push({id:uid(),staffId:user().id,date:today(),clockIn:d.toLocaleTimeString('vi-VN'),clockInISO:d.toISOString(),clockOut:'',clockOutISO:''});save();render('attendance');
}
function clockOut(){
 let a=db.attendance.find(x=>x.staffId===user().id&&!x.clockOut);if(!a)return alert('Không tìm thấy lượt chấm công đang mở.');
 let d=new Date();a.clockOut=d.toLocaleTimeString('vi-VN');a.clockOutISO=d.toISOString();save();render('attendance');
}
function staff(v){v.innerHTML=pageHead('Nhân viên & phân quyền','Đang đăng nhập: '+esc(user().name)+' · '+esc(user().role),`<button class="primary" onclick="staffModal()">＋ Tạo tài khoản nhân viên</button>`)+`<div class="notice">Chỉ tài khoản Quản lý mới được tạo/sửa tài khoản. Nếu đang đăng nhập Thu ngân, hãy bấm nút Đăng nhập / Đổi tài khoản ở góc trên bên phải và đăng nhập bằng Quản lý.</div><div class="panel"><table><thead><tr><th>Nhân viên</th><th>Tên đăng nhập</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr></thead><tbody>${db.staff.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.username)}</td><td><span class="pill">${s.role}</span></td><td>${s.active?'Đang hoạt động':'Đã khóa'}</td><td><button class="small" onclick="staffModal('${s.id}')">Sửa</button></td></tr>`).join('')}</tbody></table><p class="footer-note">Quản lý: toàn quyền. Thu ngân: bán hàng, xem đơn của mình, chấm công và quản lý ca của mình; không được xem danh sách khách hàng, danh mục, nhập hàng, thu chi, báo cáo hoặc cài đặt.</p></div>`}

function performExcelExport(){let from=document.getElementById('exportFrom').value,to=document.getElementById('exportTo').value;if(!from||!to||from>to)return alert('Khoảng thời gian không hợp lệ.');let inRange=x=>x>=from&&x<=to,sheets=[],orders=db.orders.filter(o=>inRange(o.date)),cash=db.cash.filter(x=>inRange(x.date)),shifts=db.shifts.filter(x=>inRange(x.startDate)||inRange(x.endDate||'')),attendance=db.attendance.filter(x=>inRange(x.date));if(document.getElementById('exOrders').checked){sheets.push(['Don hang',[['Mã đơn','Ngày','Giờ','Khách hàng','Ghi chú','Tạm tính','Giảm giá','Tổng tiền','Giá vốn','Lợi nhuận','Thanh toán','Trạng thái','Nhân viên'],...orders.map(o=>[o.code,o.date,o.time,o.customer,o.note||'',o.subtotal,o.discount,o.total,o.actualCost,o.actualProfit,o.payment,o.status,db.staff.find(x=>x.id===o.staffId)?.name||''])]]);sheets.push(['Chi tiet mon',[['Mã đơn','Tên món','Size','Số lượng','Đơn giá','Topping','Đường','Đá'],...orders.flatMap(o=>o.items.map(i=>[o.code,i.name,i.size,i.qty,i.unitPrice,i.toppings.map(t=>t.name).join(', '),i.sugar,i.ice]))]])}if(document.getElementById('exCash').checked)sheets.push(['Thu chi',[['Ngày','Giờ','Loại','Danh mục','Số tiền','Nội dung'],...cash.map(x=>[x.date,x.time||'',x.type,x.category,x.amount,x.note])]]);if(document.getElementById('exShifts').checked)sheets.push(['Ca lam',[['Nhân viên mở ca','Ngày mở','Giờ mở','Ngày chốt','Giờ chốt','Người chốt','Tiền đầu ca','Doanh thu','Tiền thực đếm','Chênh lệch','Trạng thái','Ghi chú'],...shifts.map(x=>[db.staff.find(s=>s.id===x.staffId)?.name||'',x.startDate,x.startTime,x.endDate||'',x.endTime||'',x.closedByName||'',x.openingCash,shiftSales(x.id),x.actualCash??'',x.difference??'',x.status,x.closeNote||''])]]);if(document.getElementById('exAttendance').checked)sheets.push(['Cham cong',[['Nhân viên','Ngày','Giờ vào','Giờ ra','Tổng giờ'],...attendance.map(a=>[db.staff.find(x=>x.id===a.staffId)?.name||'',a.date,a.clockIn,a.clockOut||'',a.clockOutISO?((new Date(a.clockOutISO)-ne const BACKUP_DB='MilkTeaBackupHandles';
function backupDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(BACKUP_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('handles');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storeBackupHandle(handle){let d=await backupDB();return new Promise((resolve,reject)=>{let tx=d.transaction('handles','readwrite');tx.objectStore('handles').put(handle,'dailyFolder');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getBackupHandle(){let d=await backupDB();return new Promise((resolve,reject)=>{let r=d.transaction('handles').objectStore('handles').get('dailyFolder');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
async function chooseBackupFolder(){if(!window.showDirectoryPicker)return alert('Trình duyệt này chưa hỗ trợ chọn thư mục ghi tự động. Hãy dùng Chrome hoặc Edge bản mới nhất.');try{let h=await window.showDirectoryPicker({mode:'readwrite'});await storeBackupHandle(h);document.getElementById('backupStatus').textContent='Đã chọn thư mục: '+h.name+'. Ứng dụng sẽ thử sao lưu mỗi ngày khi được mở.';await runDailyBackup(true)}catch(e){if(e.name!=='AbortError')alert('Không thể chọn thư mục: '+e.message)}}
async function runDailyBackup(force=false){try{let h=await getBackupHandle();if(!h){let el=document.getElementById('backupStatus');if(el)el.textContent='Chưa cấu hình thư mục sao lưu.';return}let perm=await h.queryPermission({mode:'readwrite'});if(perm!=='granted')perm=await h.requestPermission({mode:'readwrite'});if(perm!=='granted'){let el=document.getElementById('backupStatus');if(el)el.textContent='Chưa được cấp quyền ghi thư mục. Hãy bấm Sao lưu ngay vào thư mục.';return}let last=localStorage.getItem('milkTeaLastAutoBackup');if(!force&&last===today()){let el=document.getElementById('backupStatus');if(el)el.textContent='Đã sao lưu tự động hôm nay.';return}let file=await h.getFileHandle('MILK_TEA_BACKUP_'+today()+'.json',{create:true}),w=await file.createWritable();await w.write(JSON.stringify(db,null,2));await w.close();localStorage.setItem('milkTeaLastAutoBackup',today());let el=document.getElementById('backupStatus');if(el)el.textContent='Sao lưu thành công: '+h.name+' / MILK_TEA_BACKUP_'+today()+'.json'}catch(e){let el=document.getElementById('backupStatus');if(el)el.textContent='Không thể tự sao lưu: '+e.message+' · Hãy cấp lại quyền hoặc sao lưu thủ công.'}}

function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='milk-tea-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){let f=document.getElementById('restoreFile').files[0];if(!f)return alert('Chọn file sao lưu.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.orders||!x.ingredients||!x.staff)throw Error();if(confirm('Khôi phục sẽ thay thế dữ liệu đang có. Tiếp tục?')){db=x;save();render('dashboard');alert('Khôi phục thành công.')}}catch(e){alert('File sao lưu không hợp lệ.')}};r.readAsText(f)}
